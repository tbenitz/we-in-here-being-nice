var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

function fmtDuration(x){return x<60?x+' sec':x%60===0?(x/60)+' min':Math.floor(x/60)+'m '+x%60+'s'}
function roundDuration(r){let d=Number(r.opts.duration);return Number.isFinite(d)?d:120}
function rsec(r,player){let mode=r.opts.mode;if(mode==='shared'){if(!r.startAt)return null;return Math.max(0,(r.startAt+roundDuration(r)*1000-Date.now())/1000)}let at=(r.indivStarts||{})[player];if(!at)return null;return Math.max(0,(at+roundDuration(r)*1000-Date.now())/1000)}
function isExpired(r,player){let s=rsec(r,player);return s!==null&&s<=0}
function isRunning(r,player){let s=rsec(r,player);if(s===null)return false;let t=r.opts.mode==='shared'?r.startAt:r.indivStarts[player];return !!t&&Date.now()>=t&&s>0}
function isPending(r,player){return r.opts.mode==='shared'&&r.startAt&&Date.now()<r.startAt}
function fmtClock(r,player){let s=rsec(r,player);if(s===null)return secFmt(roundDuration(r));if(isPending(r,player))return secFmt((r.startAt-Date.now())/1000);return secFmt(s)}
function stampLabel(r,player){if(!r)return'';if(isExpired(r,player))return"Time’s up";if(isPending(r,player))return 'Starts in';if(rsec(r,player)===null)return r.opts.mode==='shared'?'Waiting for host':'Starts on reveal';return 'Time remaining'}
function timerHtml(r,player,compact=false){let remain=rsec(r,player),width=remain===null?100:Math.max(0,Math.min(100,100*remain/roundDuration(r))),low=remain!==null&&remain<=10&&!isPending(r,player);return `<div class="timerbox ${compact?'compactbox':''}"><div class="status" data-clock-label>${e(stampLabel(r,player))}</div><div class="clock ${compact?'compact':''} ${low?'low':''}" data-clock>${e(fmtClock(r,player))}</div><div class="progress"><div data-progress style="width:${width}%" class="${low?'low':''}"></div></div><div class="small muted" data-timer-foot>${e(r.opts.mode==='shared'?'One clock for everybody':'Your personal countdown')}</div></div>`}
function toast(s){document.querySelectorAll('.toast').forEach(x=>x.remove());let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3100)}
function dopt(name,choices){return choices.map(([val,label])=>`<option value="${e(val)}" ${String(data.draft[name])===String(val)?'selected':''}>${e(label)}</option>`).join('')}
function toggle(name,title,desc){return `<div class="toggleline"><div><strong>${e(title)}</strong><small>${e(desc)}</small></div><label class="switch"><input type="checkbox" data-field="${e(name)}" ${data.draft[name]?'checked':''}><span></span></label></div>`}
function header(){const theme=document.documentElement.dataset.theme||'dark';let stage=guest?'YOUR PHONE':remote?'PRIVATE CARD':data.phase==='setup'?'CREATE A ROUND':data.phase==='lobby'?'PASS & PLAY':data.phase==='mission'?'SECRET MISSION':'DEBRIEF';return `<header class="topbar"><div class="brand"><div class="brandicon">✳</div><span>we in here being nice </span></div><div class="topright"><div class="pill">${stage}</div><button class="iconbtn" data-act="help" aria-label="How to play" title="How to play">?</button><button class="iconbtn" data-act="theme-toggle" aria-label="Toggle light/dark mode" title="Switch theme">${theme==='dark'?'☼':'☾'}</button></div></header>`}
function parseSafeNames(){return parseNames(data.draft.namesText)}
function addManualPlayer(){const input=document.getElementById('manual-name');let name=(input?.value||'').trim();if(!name)return;if(name.length>36)return toast('Use 36 characters or fewer.');let players=parseSafeNames();if(players.some(n=>n.toLowerCase()===name.toLowerCase()))return toast('That player is already listed.');if(players.length>=20)return toast('The maximum is 20 players.');data.draft.namesText=players.concat(name).join('\n');save();render()}
function qrCard(){let ready=onlineHost&&hostStatus==='ready',url=joiningURL();return `<aside class="panel qr-side"><div class="eyebrow">JOIN ON YOUR PHONE</div><h2>${onlineHost?'Scan to join ✨':'Offline play ✨'}</h2><div class="qr-canvas" id="join-qr">${!onlineHost?'<div class="qr-fallback" style="color:#181824"><strong>Offline mode</strong><p style="color:#4b4c5a">Publish this HTML on GitHub Pages to enable phone joining.</p></div>':ready?'':'<div class="qr-fallback">Connecting the room…</div>'}</div><div id="room-status" class="connect-state ${ready?'':'off'}">${!onlineHost?'Offline mode — pass the phone':ready?'● Room live — scan to join':hostStatus==='connecting'?'◌ Connecting phones…':'Connection failed — retry'}</div><p>${onlineHost?"Open your camera, scan the QR code,<br>enter your name, and you’re in.":"Add names on the host, then pass it around to see your private targets."}</p>${onlineHost?`<div class="qrurl" title="${e(url)}">${e(url)}</div><div class="row wrap" style="justify-content:center"><button class="btn small" data-act="copy-room">Copy join link</button>${hostStatus==='error'?'<button class="btn small" data-act="retry-host">Retry</button>':''}</div>`:''}<p class="small muted">No app download or account needed.</p></aside>`}
function playerChips(){let names=parseSafeNames();return `<div class="joiners">${names.map(n=>`<span class="joinchip ${connections.has(n)?'live':''}">${connections.has(n)?'● ':''}${e(n)}</span>`).join('')||'<span class="small muted">No players yet. Scan the code or add names below.</span>'}</div>`}
function setup(){let players=parseSafeNames();return `<main class="host-view"><div class="mainhero"><section class="panel hero-side"><div><div class="eyebrow">A SECRET GAME OF GOOD VIBES</div><h1 class="headline">We in here<br>being <em>nice.</em></h1><p class="hero-sub">Everyone gets a secret person to compliment. Make it genuine, work it into a conversation, and don't give away your mission.</p></div><div class="how-rows"><div class="how-row"><span class="how-num">1</span>${onlineHost?'Scan the QR code and enter your name':'Add names below and pass this device around'}</div><div class="how-row"><span class="how-num">2</span>Get your secret target when the round starts</div><div class="how-row"><span class="how-num">3</span>Give them a real compliment before time runs out</div></div><div class="host-card"><label class="sectionlabel" for="manual-name">Or add someone without a phone</label><div class="add-row"><input id="manual-name" placeholder="Enter their name" maxlength="36" autocomplete="off"><button class="btn" data-act="manual-add">Add</button></div></div></section>${qrCard()}</div><section class="panel host-bottom"><div><div class="setupcount" style="margin-bottom:7px">${players.length} player${players.length===1?'':'s'} joined · ${e(fmtDuration(durationFromDraft()||120))} round</div>${playerChips()}</div><div class="hostcontrols"><button class="btn" data-act="settings">⚙ Settings</button><button class="btn primary" data-act="start-round" ${players.length<3?'disabled':''} style="min-width:190px">Start round (${players.length}/3+) →</button></div></section></main>`}
function settingsHtml(){let names=parseSafeNames(),options=names.map((n,i)=>`<option value="${i}">${e(n)}</option>`).join('');return `<div class="eyebrow">OPTIONAL</div><h2>Round settings</h2><div class="small muted">The defaults work great. Customize the round if you'd like.</div><div class="settingsgrid" style="margin:18px 0"><div class="field"><label>Timer</label><select data-field="duration">${dopt('duration',[['30','30 seconds'],['60','1 minute'],['120','2 minutes'],['180','3 minutes'],['300','5 minutes'],['custom','Custom']])}</select></div>${data.draft.duration==='custom'?`<div class="field"><label>Seconds</label><input type="number" data-field="customDuration" min="10" max="3600" value="${e(data.draft.customDuration)}"></div>`:''}<div class="field"><label>Clocks</label><select data-field="mode">${dopt('mode',[['shared','Everyone together'],['individual','Each player starts on reveal']])}</select></div><div class="field"><label>Mutual targets</label><select data-field="mutual">${dopt('mutual',[['prefer','Prefer to avoid'],['force','Never allow'],['allow','Allow']])}</select></div><div class="field"><label>Ideas</label><select data-field="helper">${dopt('helper',[['soft','Soft / easy'],['bold','Bold / meaningful'],['random','Mix it up'],['off','Off']])}</select></div><div class="field"><label>Theme</label><select data-field="theme">${dopt('theme',Object.entries(themes))}</select></div>${data.draft.theme==='custom'?`<div class="field"><label>Custom theme</label><input data-field="themeCustom" placeholder="e.g. something they made" maxlength="160" value="${e(data.draft.themeCustom)}"></div>`:''}<div class="field"><label>Hide target after</label><select data-field="autohide">${dopt('autohide',[['0','Manual'],['5','5 sec'],['8','8 sec'],['15','15 sec'],['25','25 sec']])}</select></div><div class="field"><label>Pass-phone style</label><select data-field="reveal">${dopt('reveal',[['select','Pick name'],['sequential','Pass in order']])}</select></div></div>${toggle('alerts','Vibration & sound','Countdown alerts')}${toggle('score','Scoreboard','Track completed compliments')}<div class="divider"></div><div class="field"><label>Players (one per line or separated by commas)</label><textarea id="names" rows="3" placeholder="Add names here too">${e(data.draft.namesText)}</textarea></div><div class="divider"></div><h2 style="font-size:16px">Excluded pairings</h2><p class="small muted">These players can't target each other.</p><div class="exrow"><select id="exclude-a">${options}</select><span>×</span><select id="exclude-b">${names.length>1?names.map((n,i)=>`<option value="${i}" ${i===1?'selected':''}>${e(n)}</option>`).join(''):options}</select><button class="btn small" data-act="exclude-add">Add</button></div><div class="exlist">${data.excluded.map(pair=>`<button data-act="exclude-del" data-a="${e(encodeURIComponent(pair[0]))}" data-b="${e(encodeURIComponent(pair[1]))}">${e(pair.join(' × '))} ✕</button>`).join('')||'<span class="small muted">No exclusions.</span>'}</div><button class="btn primary wide" data-act="modal-close">Done</button>`}
function genAssignments(players,excluded,mutual,previous){let n=players.length,ban=new Set();for(let pair of excluded){let i=players.indexOf(pair[0]),j=players.indexOf(pair[1]);if(i>=0&&j>=0&&i!==j){ban.add(i+':'+j);ban.add(j+':'+i)}}
 let allowed=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>j).filter(j=>j!==i&&!ban.has(i+':'+j)));if(allowed.some(a=>!a.length))return null;
 let best=null,bestScore=Infinity;let budget=110000;
 function attempt(){let assigned=new Array(n).fill(-1),used=new Set(),order=shuffle(Array.from({length:n},(_,i)=>i)).sort((a,b)=>allowed[a].length-allowed[b].length);function dfs(pos){if(--budget<=0)return false;if(pos===n)return true;let i=order[pos],poss=shuffle(allowed[i].filter(j=>!used.has(j)&&!(mutual==='force'&&assigned[j]===i)));if(previous&&n>3)poss.sort((a,b)=>(previous[i]===a?1:0)-(previous[i]===b?1:0));for(let j of poss){assigned[i]=j;used.add(j);if(dfs(pos+1))return true;assigned[i]=-1;used.delete(j)}return false}return dfs(0)?assigned:null}
 let attempts=mutual==='allow'?1:Math.min(110,Math.max(28,n*5));for(let k=0;k<attempts&&budget>0;k++){let a=attempt();if(!a)break;let reciprocal=0,repeated=0;for(let i=0;i<n;i++){if(a[a[i]]===i)reciprocal++;if(previous&&previous[i]===a[i])repeated++}let score=(mutual==='allow'?0:reciprocal*100)+repeated*2;if(score<bestScore){best=a.slice();bestScore=score}if(bestScore===0)break}return best}
function durationFromDraft(){let d=data.draft;return d.duration==='custom'?Math.floor(Number(d.customDuration)):Math.floor(Number(d.duration))}
function startRound(){let players=parseSafeNames();if(players.length<3){toast('Add at least 3 unique players to begin.');return}if(players.length>20){toast('This version supports up to 20 players.');return}if(players.some(n=>n.length>36)){toast('Please shorten names to 36 characters.');return}let duration=durationFromDraft();if(!Number.isFinite(duration)||duration<10||duration>3600){toast('Choose a duration between 10 and 3,600 seconds.');return}let excludes=data.excluded.filter(p=>players.includes(p[0])&&players.includes(p[1]));let prev=data.round?.players?.join('\0')===players.join('\0')?players.map(p=>data.round.players.indexOf(data.round.assignments[p])):null;let indexes=genAssignments(players,excludes,data.draft.mutual,prev);if(!indexes){toast('No valid assignment. Remove an exclusion or allow mutual targets.');return}let assignments={};players.forEach((p,i)=>assignments[p]=players[indexes[i]]);let opts={...data.draft,duration,themeText:data.draft.theme==='custom'?data.draft.themeCustom:themes[data.draft.theme]};let startAt=opts.mode==='shared'&&Number(opts.lead)>0?Date.now()+Number(opts.lead)*60000:null;data.round={id:Date.now().toString(36)+rng(1000000).toString(36),players,assignments,opts,createdAt:Date.now(),startAt,indivStarts:{},seen:{},done:{},credited:false,order:0};data.phase='lobby';missionPeek=false;sessionRevealAll=false;sessionRevealed.clear();timerNotices.clear();save();notifyGuests();render();toast('Secret assignments are ready!')}
function finalize(){let r=data.round;if(!r||r.credited)return;for(let name of r.players){if(r.done[name])data.scores[name]=(data.scores[name]||0)+1}r.credited=true;save()}
function showDebrief(){if(!data.round)return;finalize();data.phase='debrief';missionPeek=false;render();save();notifyGuests()}
function beginClock(){let r=data.round;if(!r||r.opts.mode!=='shared'||r.startAt)return;r.startAt=Date.now();save();notifyGuests();render();toast('The clock is running!')}
function openMission(name){let r=data.round;if(!r||!r.players.includes(name))return;if(r.opts.reveal==='sequential'&&!r.seen[name])r.order=Math.max(r.order,r.players.indexOf(name));r.seen[name]=true;data.currentPlayer=name;data.phase='mission';missionPeek=false;ideas=selectIdeas(r.opts);save();render()}
function selectIdeas(opts){if(opts.helper==='off')return[];let pool=opts.helper==='random'?(rng(2)?prompts.soft:prompts.bold):prompts[opts.helper]||prompts.soft;return shuffle(pool).slice(0,3)}
function revealMission(){if(remote){if(!remoteLocal.firstReveal&&remote.opts.mode==='individual'){remoteLocal.firstReveal=Date.now();saveRemote()}remoteLocal.seen=true;saveRemote();if(guest&&guestConnection?.open)guestConnection.send({t:'seen',id:remote.id})}else{let r=data.round;if(!r)return;let p=data.currentPlayer;if(r.opts.mode==='individual'&&!r.indivStarts[p]){r.indivStarts[p]=Date.now();save()}}let r=remote?remoteRound():data.round,p=remote?remote.name:data.currentPlayer;if(isExpired(r,p)){toast('This mission is locked: time is up.');render();return}missionPeek=true;render();scheduleHide()}
function scheduleHide(){clearTimeout(autoHideTimer);let sec=Number((remote?remote.opts:data.round?.opts)?.autohide||0);if(sec>0&&missionPeek){autoHideTimer=setTimeout(()=>{missionPeek=false;render()},sec*1000)}}
function closeMission(){clearTimeout(autoHideTimer);missionPeek=false;if(remote){render();return}let r=data.round;if(r&&r.opts.reveal==='sequential'){let i=r.players.indexOf(data.currentPlayer);r.order=Math.max(r.order,i+1)}data.currentPlayer=null;data.phase='lobby';save();render()}
function markDone(name){if(remote){let r=remoteRound();if(!isRunning(r,name)){toast('Wait until your timer starts.');return}remoteLocal.done=!remoteLocal.done;saveRemote();if(guest&&guestConnection?.open)guestConnection.send({t:'done',done:remoteLocal.done,id:remote.id});render();toast(remoteLocal.done?'Marked done. Smooth move!':'Completion cleared.');return}let r=data.round;if(!r)return;if(data.phase!=='debrief'&&!isRunning(r,name)){toast('The timer must be running to mark done.');return}let next=!r.done[name];r.done[name]=next;if(r.credited)data.scores[name]=Math.max(0,(data.scores[name]||0)+(next?1:-1));save();render();if(data.phase==='mission')toast(next?'Mission complete. Nicely done.':'Completion cleared.')}
function remoteRound(){if(!remote)return null;return{opts:remote.opts,startAt:remote.startAt,indivStarts:{[remote.name]:remote.personalStartAt||(remoteLocal.firstReveal||null)}}}
function encode(o){let bytes=new TextEncoder().encode(JSON.stringify(o)),s='';for(let b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decode(s){s=s.trim();if(s.startsWith('#mission='))s=s.slice(9);if(s.includes('#mission='))s=s.split('#mission=')[1];if(s.length<10||s.length>8000||!/^[A-Za-z0-9_\-=]+$/.test(s))throw Error('invalid code');let z=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4));let b=Uint8Array.from(z,c=>c.charCodeAt(0)),p=JSON.parse(new TextDecoder().decode(b));if(p.v!==1||typeof p.id!=='string'||p.id.length>100||typeof p.name!=='string'||!p.name.trim()||p.name.length>36||typeof p.target!=='string'||!p.target.trim()||p.target.length>36||!p.opts||!['shared','individual'].includes(p.opts.mode)||!Number.isFinite(Number(p.opts.duration))||Number(p.opts.duration)<10||Number(p.opts.duration)>3600||!Number.isFinite(Number(p.startAt||0)))throw Error('invalid card');return p}
function missionPayload(name){let r=data.round;if(!r)return null;return{v:1,id:r.id,name,target:r.assignments[name],opts:{duration:r.opts.duration,mode:r.opts.mode,autohide:r.opts.autohide,helper:r.opts.helper,themeText:r.opts.themeText,alerts:r.opts.alerts},startAt:r.startAt||null,personalStartAt:r.indivStarts[name]||null}}
function inviteUrl(code){return location.href.split('#')[0]+'#mission='+code}
function shareable(){let r=data.round;return r&&(r.opts.mode==='individual'||!!r.startAt)}
function openShare(name){if(!shareable()){toast('Start or schedule the shared clock before sending phone cards.');return}modal={type:'share',name};renderModal()}
function joinCode(s){try{const p=decode(s);location.hash='mission='+encode(p);loadRemote(p);modal=null;render();toast('Private mission loaded.')}catch(err){toast('That mission code is not valid. Check the full text.') }}
function loadRemote(p){remote=p;missionPeek=false;timerNotices.clear();try{remoteLocal=JSON.parse(localStorage.getItem(remoteKey()))||{}}catch(err){remoteLocal={}}ideas=selectIdeas(p.opts)}

async function copy(s){try{await navigator.clipboard.writeText(s);toast('Copied to clipboard!')}catch(err){let ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();toast(ok?'Copied to clipboard!':'Select and copy the code manually.')}}
function lobby(){const r=data.round,seen=r.players.filter(n=>r.seen[n]).length,done=r.players.filter(n=>r.done[n]).length,started=!!r.startAt,seq=r.opts.reveal==='sequential';return `<main class="host-view"><div class="mainhero"><section class="panel host-compact"><div><div class="eyebrow">ROUND IN PROGRESS · ${r.players.length} PEOPLE</div><h1 class="headline" style="font-size:clamp(37px,4vw,61px)">Time to be <em>nice.</em></h1><p class="hero-sub">Check your phone for your secret target. Compliment that person naturally before the clock runs out.</p></div><div class="maintimer">${timerHtml(r,null)}</div><div class="hostcontrols" style="justify-content:center">${r.opts.mode==='shared'&&!started?'<button class="btn primary" data-act="begin-clock">▶ Start countdown</button>':''}<button class="btn" data-act="show-debrief">End & debrief</button></div><div><div class="sectionlabel">${seen}/${r.players.length} missions seen · ${done} done</div><div class="lobbyplayers">${r.players.map(n=>`<button class="btn small ${r.done[n]?'mint':''}" data-act="confirm-player" data-name="${e(encodeURIComponent(n))}" title="Pass this device to ${e(n)}">${connections.has(n)?'● ':''}${e(n)} ${r.done[n]?'✓':''}</button>`).join('')}</div><p class="small muted">No phone? Tap your name above on the host device, look privately, and hide it again.</p></div></section>${qrCard()}</div><section class="panel host-bottom"><div class="small muted">${started?'Mingle naturally. When you finish, tap Done on your phone.':r.opts.mode==='individual'?'Clocks begin when each player reveals their target.':'Everyone receives a mission now. Press Start countdown when ready.'}</div><div class="hostcontrols"><button class="btn" data-act="share-help">Other sharing options</button><button class="btn primary" data-act="show-debrief">Debrief →</button></div></section></main>`}
function mission(){let r=remote?remoteRound():data.round;if(!r)return setup();let name=remote?remote.name:data.currentPlayer,target=remote?remote.target:data.round.assignments[name],done=remote?!!remoteLocal.done:!!data.round.done[name],opts=r.opts,expired=isExpired(r,name),shown=missionPeek&&!expired,theme=opts.themeText&&opts.themeText!=='No special theme'?opts.themeText:null;let canDone=isRunning(r,name);let helper=opts.helper!=='off';return `<div class="missionwrap ${remote?'phone-mission':''}"><main class="missionpanel"><div class="missiontop"><span class="eyebrow">YOUR MISSION · ${e(name)}</span><button class="btn small ghost" data-act="${remote?'exit-remote':'close-mission'}">${remote?'Hide':'← Hide & back'}</button></div><div class="targetbox ${shown?'shown':''}" id="target-box"><div class="sectionlabel">${expired?'MISSION LOCKED':shown?'YOUR SECRET TARGET':'TOP SECRET · EYES ONLY'}</div>${shown?`<div class="targetname">${e(target)}</div>`:expired?`<div class="secretmask">Time's up 🔒</div>`:`<div class="secretmask">•••  •••  •••</div>`}</div>${!expired?`<button class="btn ${shown?'ghost':'soft'}" data-act="${shown?'hide-target':'reveal-target'}" style="min-width:205px">${shown?'◉ Hide target':'◉ Tap to privately reveal'}</button>`:`<div class="small muted">No more peeking this round.</div>`}<div class="missiontimer">${timerHtml(r,name)}</div>${theme?`<div class="small" style="padding:7px;color:var(--gold)">✦ Today's theme: <strong>${e(theme)}</strong></div>`:''}${helper&&!expired?`<div class="row between" style="margin-top:9px"><span class="sectionlabel" style="margin:0">${shown?'Compliment angles':'Optional hint ideas'}</span><button class="btn small ghost" data-act="refresh-ideas">↻ Shuffle</button></div><div class="ideas">${ideas.map(([cat,tip])=>`<div class="idea"><b>${e(cat)}</b>${e(tip)}</div>`).join('')}</div>`:''}${remote&&helper&&!expired?`<details class="phone-hint"><summary>Need a compliment idea?</summary><div class="small">${ideas.map(([cat,tip])=>`<p><b>${e(cat)}:</b> ${e(tip)}</p>`).join('')}</div></details>`:''}<div class="missionactions"><button class="btn ${done?'mint':'primary'}" data-act="done" ${!canDone&&!done?'disabled':''}>${done?'✓ You got it!':'✓ Mark done'}</button><button class="btn" data-act="${remote?'exit-remote':'close-mission'}">${remote?'Close card':'Pass / go back'}</button></div>${done?'<div class="doneword small">Successfully marked! Now act normal.</div>':expired?'<div class="small muted">Round ended. Your target stays locked.</div>':'<div class="how">Keep it true, keep it natural. Work the compliment into a conversation instead of announcing it. Your screen auto-hides after a few seconds.</div>'}<div class="remotefooter">${remote?'PRIVATE PHONE CARD · Only your assignment is in this link':'ONE DEVICE MODE · Hide your card before handing over'}</div></main></div>`}
function debrief(){let r=data.round,completed=r.players.filter(p=>r.done[p]).length;let showAll=sessionRevealAll;let scores=r.players.map(n=>[n,data.scores[n]||0]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));return `<div class="endbanner"><div class="eyebrow">ROUND COMPLETE</div><h1 class="bigtitle">Okay, who got <span style="color:var(--pink)">who?</span></h1><p class="subtitle" style="margin:auto">Everyone had a secret mission. Only reveal targets if the group wants to. Mark successful compliments on the honor system.</p><div class="row wrap" style="justify-content:center;margin-top:15px"><span class="chip">✳ ${r.players.length} players</span><span class="chip">✓ ${completed} completed</span><span class="chip">⏱ ${fmtDuration(roundDuration(r))}</span></div></div><div class="debriefgrid"><section class="panel panel-pad"><div class="fieldhead"><div><h2>Who had whom?</h2><div class="small muted">Tap to reveal individually, or reveal everyone.</div></div><button class="btn small ${showAll?'ghost':'soft'}" data-act="reveal-all">${showAll?'Hide all':'Reveal all'}</button></div><div class="results">${r.players.map((n,i)=>{let show=showAll||sessionRevealed.has(n);return `<div class="resultrow"><div style="min-width:0"><strong>${e(n)}</strong><div class="small ${show?'ans':'unseen'}">${show?'→ '+e(r.assignments[n]):'→ Secret target hidden'}</div></div><div class="row" style="gap:5px"><button class="btn small" data-act="reveal-one" data-name="${e(encodeURIComponent(n))}">${show?'Hide':'Reveal'}</button>${r.opts.score?`<button class="btn small ${r.done[n]?'mint':''}" data-act="score-toggle" data-name="${e(encodeURIComponent(n))}" title="Self-reported success">${r.done[n]?'✓ Done':'+ Done'}</button>`:''}</div></div>`}).join('')}</div><p class="footnote">This game doesn't verify compliments. "Done" means a player says they completed it. Phone players who joined via the room QR report Done live. Private codes used separately do not sync.</p></section><aside class="panel panel-pad stack"><div><h2>${r.opts.score?'Good vibes leaderboard':'Round recap'}</h2><div class="small muted">${r.opts.score?'Cumulative completed missions across rounds on this host device.':'No points — just kindness and pure suspicion.'}</div></div>${r.opts.score?`<table class="scoretable">${scores.map(([name,score],i)=>`<tr><td>${i===0?'✳':i+1+'.'} ${e(name)}</td><td>${score} ${score===1?'point':'points'}</td></tr>`).join('')}</table>`:''}<button class="btn primary wide" data-act="new-round" style="min-height:55px">↻ Reshuffle · New round</button><button class="btn wide" data-act="edit-setup">Edit players / settings</button><button class="btn ghost danger wide small" data-act="reset-scores">Clear leaderboard</button></aside></div>`}
function remoteView(){return mission()}
function guestView(){if(!guest)return '';if(remote){return `<div class="phone-view">${guest.over?`<div class="phone-layout"><main class="panel phone-card"><div class="eyebrow">TIME TO DEBRIEF</div><div class="bigphone">Round over 💛</div><p class="phone-desc">Thanks for spreading some kindness. Look up at the host screen for the recap.</p><button class="btn primary wide" data-act="guest-wait">Wait for next round</button></main></div>`:`${!guestConnection?.open?'<div class="note disconnect-banner">Connection lost. <button class="btn small" data-act="guest-reconnect">Reconnect</button></div>':''}${remoteView()}`}</div>`}
 let ready=!!guest.name,waiting=guest.waiting,connected=guestConnection?.open;return `<main class="phone-layout"><section class="panel phone-card"><div class="phone-status">${connected?'● Connected to the game':'◌ '+e(connectionStatus||'Connecting')}</div><div class="bigphone">${waiting?'You’re in! 💛':'We in here\nbeing nice.'}</div><p class="phone-desc">${waiting?'The host will send your secret target when the round begins. Keep this page open.':'Join the room with your name. Your secret target appears here when the host starts.'}</p>${!waiting?`<input id="guest-name" aria-label="Your name" maxlength="36" placeholder="Your first name" value="${e(guest.name||'')}" autocomplete="given-name"><button class="btn primary wide" data-act="guest-join" ${!connected?'disabled':''}>Join game →</button>`:'<div class="info" style="margin:20px 0"><strong>'+e(guest.name)+'</strong> · Waiting for your mission</div>'}${guest.error?`<div class="note">${e(guest.error)}</div>`:''}<button class="btn small ghost" data-act="guest-reconnect" style="margin-top:12px">${connected?'Reconnect':'Retry connection'}</button></section></main>`}
function render(){if(!remote&&data.phase!=='setup'&&!data.round)data.phase='setup';if(!remote&&data.phase==='mission'&&!data.currentPlayer)data.phase='lobby';app.innerHTML=header()+`<div class="shell">${guest?guestView():remote?remoteView():data.phase==='setup'?setup():data.phase==='lobby'?lobby():data.phase==='mission'?mission():debrief()}</div>`;renderModal();afterRender();updateClock()}
function renderModal(){if(!modal){overlay.innerHTML='';return}let c='';if(modal.type==='settings'){c=settingsHtml()}else if(modal.type==='confirm'){c=`<div class="eyebrow" style="margin-bottom:8px">YOUR EYES ONLY</div><h2>Are you ${e(modal.name)}?</h2><p class="muted small">Make sure nobody is looking over your shoulder. Your target won't show until you tap the reveal button.</p><div class="row" style="margin-top:18px"><button class="btn primary" data-act="confirm-yes" style="flex:1">Yep, that's me →</button><button class="btn" data-act="modal-close">Not me</button></div>`}else if(modal.type==='share'){let link=createMissionLink();c=`<div class="eyebrow" style="margin-bottom:8px">PRIVATE INVITATION</div><h2>Mission for ${e(modal.name)}</h2><p class="muted small">Send only to ${e(modal.name)}. Their link/code includes only their own target, never the full pairing list.</p>${link.url?`<div class="sectionlabel">One-tap phone link</div><textarea class="codefield" readonly id="share-link">${e(link.url)}</textarea><div class="row"><button class="btn primary" data-act="copy-link" style="flex:1">Copy link</button><button class="btn" data-act="native-share">↗ Send</button></div>`:'<div class="note">You are running the file locally. A file:// link cannot open on another phone. Send the code below and have them open their own copy of this HTML file.</div>'}<div class="sectionlabel" style="margin-top:15px">Private mission code (copy / paste)</div><textarea class="codefield" readonly id="share-code">${e(link.code)}</textarea><div class="row"><button class="btn" data-act="copy-code" style="flex:1">Copy private code</button><button class="btn ghost" data-act="modal-close">Close</button></div><div class="help">For group-wide synchronized timers, codes must be sent after the shared clock starts or when a future start time is scheduled. No live device-to-device score syncing is used.</div>`}else if(modal.type==='help'){c=`<div class="eyebrow">HOW TO PLAY</div><h2>How to play</h2><div class="stack small muted" style="margin:14px 0;gap:11px"><div><strong style="color:var(--txt)">1. Get your mission.</strong> Add names, set a timer, then privately reveal your assigned person.</div><div><strong style="color:var(--txt)">2. Blend in.</strong> Mingle normally. Don't announce your mission or check your screen right before speaking.</div><div><strong style="color:var(--txt)">3. Say something real.</strong> Give that person an honest, specific, appropriate compliment before the clock runs out.</div><div><strong style="color:var(--txt)">4. Mark done.</strong> Check off your mission if you succeeded. It is a friendly honor system, not a competition to make anyone uncomfortable.</div><div><strong style="color:var(--txt)">5. Debrief or reshuffle.</strong> You can guess who complimented whom, reveal targets optionally, and play again.</div></div><div class="info"><strong>Phone sharing:</strong> A hosted copy can send private links; a local HTML file can send private copy/paste codes. Each card contains only its recipient's mission. Points on separate phones must be reported to the host.</div><button class="btn primary wide" data-act="modal-close" style="margin-top:15px">Let's be nice</button>`}else if(modal.type==='tips'){c=`<div class="eyebrow">PLAYING FROM MULTIPLE PHONES</div><h2>Private cards, no server.</h2><p class="muted small">Everyone can scan the single room QR on the host screen and type their name. Their private mission will appear on their own phone. If playing locally without an online room, pass the host phone around or send individual private codes.</p><div class="info">Each link contains exactly one target. Guests have their own timer and private Done button, and joined phones can send Done updates to the host. At debrief, the host can mark success reported by each player.</div><button class="btn primary wide" data-act="modal-close" style="margin-top:16px">Got it</button>`}
 overlay.innerHTML=`<div class="modalbg" data-act="modal-bg"><div class="modal ${modal.type==='settings'?'settings-modal':''}" role="dialog" aria-modal="true" aria-label="Game dialog">${c}</div></div>`}
function updateClock(){let r=remote?remoteRound():data.round;if(!r||(!remote&&!['lobby','mission'].includes(data.phase)))return;let p=remote?remote.name:(data.phase==='mission'?data.currentPlayer:null);let label=stampLabel(r,p),clock=fmtClock(r,p),secs=rsec(r,p),progress=secs===null?100:Math.max(0,Math.min(100,100*secs/roundDuration(r))),low=secs!==null&&secs<=10&&!isPending(r,p);document.querySelectorAll('[data-clock]').forEach(x=>{x.textContent=clock;x.classList.toggle('low',low)});document.querySelectorAll('[data-clock-label]').forEach(x=>x.textContent=label);document.querySelectorAll('[data-progress]').forEach(x=>{x.style.width=progress+'%';x.classList.toggle('low',low)});let key=(remote?'r:':'h:')+r.opts.mode+':'+(p||'all');if(isRunning(r,p)&&secs<=10&&secs>0&&!timerNotices.has(key+'low')){timerNotices.add(key+'low');signal('low',r.opts.alerts)}if(isExpired(r,p)&&!timerNotices.has(key+'expired')){timerNotices.add(key+'expired');signal('end',r.opts.alerts);if(remote||data.phase==='mission'){missionPeek=false;render()}}if(r.opts.mode==='shared'&&r.startAt&&Date.now()>=r.startAt&&Date.now()<r.startAt+500&&!timerNotices.has(key+'started')){timerNotices.add(key+'started');if(!remote&&data.phase==='lobby')render()}}
function signal(type,enabled){if(!enabled)return;try{if(navigator.vibrate)navigator.vibrate(type==='end'?[120,75,160]:70)}catch(err){}try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx=window._niceAudio||(window._niceAudio=new C());if(ctx.state==='suspended')ctx.resume();let now=ctx.currentTime;for(let i=0;i<(type==='end'?2:1);i++){let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=type==='end'?700+i*130:550;g.gain.setValueAtTime(.001,now+i*.2);g.gain.exponentialRampToValueAtTime(.13,now+i*.2+.025);g.gain.exponentialRampToValueAtTime(.001,now+i*.2+.15);o.connect(g).connect(ctx.destination);o.start(now+i*.2);o.stop(now+i*.2+.16)}}catch(err){}}
function trimExclusions(){let n=parseSafeNames();data.excluded=data.excluded.filter(p=>n.includes(p[0])&&n.includes(p[1]));save()}
function chooseTheme(){let old=document.documentElement.dataset.theme||'dark',next=old==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem(THEME_KEY,next);render()}
function onClick(ev){let b=ev.target.closest('[data-act]');if(!b||b.disabled)return;let a=b.dataset.act,ident=b.dataset.name?decodeURIComponent(b.dataset.name):null;
 if(a==='modal-bg'){if(ev.target.classList.contains('modalbg')){modal=null;renderModal()}return}
 if(a==='settings'){modal={type:'settings'};renderModal();return}
 if(a==='manual-add')return addManualPlayer();
 if(a==='copy-room')return copy(joiningURL());
 if(a==='retry-host'){try{nicePeer?.destroy()}catch{}nicePeer=null;initHost();return}
 if(a==='guest-join')return guestJoin();
 if(a==='guest-reconnect')return resetGuest();
 if(a==='guest-wait'){guest.over=false;remote=null;guest.waiting=true;render();return}
 if(a==='help'){modal={type:'help'};renderModal();return}if(a==='theme-toggle')return chooseTheme();if(a==='modal-close'){modal=null;renderModal();return}
 if(a==='start-round')return startRound();if(a==='begin-clock')return beginClock();if(a==='exclude-add'){let names=parseSafeNames(),i=Number(document.getElementById('exclude-a')?.value),j=Number(document.getElementById('exclude-b')?.value);if(i===j)return toast('Choose two different players.');if(!names[i]||!names[j])return;let pair=[names[i],names[j]].sort((a,b)=>a.localeCompare(b));if(!data.excluded.some(p=>p[0]===pair[0]&&p[1]===pair[1]))data.excluded.push(pair);save();render();return}
 if(a==='exclude-del'){let x=decodeURIComponent(b.dataset.a),y=decodeURIComponent(b.dataset.b);data.excluded=data.excluded.filter(p=>!(p[0]===x&&p[1]===y));save();render();return}
 if(a==='join-code'){return joinCode(document.getElementById('join-code')?.value||'')}
 if(a==='confirm-player'){modal={type:'confirm',name:ident};renderModal();return}
 if(a==='confirm-yes'){let n=modal.name;modal=null;openMission(n);return}
 if(a==='reveal-target')return revealMission();if(a==='hide-target'){missionPeek=false;clearTimeout(autoHideTimer);render();return}
 if(a==='refresh-ideas'){ideas=selectIdeas(remote?remote.opts:data.round.opts);render();return}
 if(a==='done'){return markDone(remote?remote.name:data.currentPlayer)}
 if(a==='close-mission')return closeMission();if(a==='exit-remote'){if(guest){missionPeek=false;render();return}return exitRemote()}
 if(a==='skip-next'){let r=data.round;r.order=Math.min(r.players.length,r.order+1);save();render();return}
 if(a==='reset-order'){data.round.order=0;save();render();return}
 if(a==='show-debrief')return showDebrief();if(a==='reveal-all'){sessionRevealAll=!sessionRevealAll;render();return}
 if(a==='reveal-one'){sessionRevealAll=false;sessionRevealed.has(ident)?sessionRevealed.delete(ident):sessionRevealed.add(ident);render();return}
 if(a==='score-toggle')return markDone(ident);
 if(a==='new-round'){if(data.round&&!data.round.credited)finalize();startRound();return}
 if(a==='edit-setup'){if(data.round&&!data.round.credited)finalize();data.phase='setup';data.currentPlayer=null;save();render();return}
 if(a==='reset-scores'){if(!confirm('Clear all completed mission points on this host device?'))return;data.scores={};if(data.round)data.round.credited=true;save();toast('Leaderboard cleared.');render();return}
 if(a==='share-help'){modal={type:'tips'};renderModal();return}
 if(a==='share'){return openShare(ident)}
 if(a==='copy-link'){let p=createMissionLink();if(p?.url)copy(p.url);return}
 if(a==='copy-code'){let p=createMissionLink();if(p)copy(p.code);return}
 if(a==='native-share'){let p=createMissionLink();if(!p)return;if(navigator.share)navigator.share({title:'We in here being nice — your private mission',text:'Open this private mission card — only your target is inside.',url:p.url||undefined}).catch(()=>{});else copy(p.url||p.code);return}
 }
function onChange(ev){let el=ev.target;if(!el.dataset.field)return;let field=el.dataset.field;data.draft[field]=el.type==='checkbox'?el.checked:el.value;save();if(['mode','duration','theme'].includes(field))render()}
function refreshExcludeOptions(){let names=parseSafeNames();for(let id of ['exclude-a','exclude-b']){let el=document.getElementById(id);if(!el)continue;let old=el.selectedOptions[0]?.textContent;el.replaceChildren(...names.map(name=>{let o=document.createElement('option');o.textContent=name;o.value=String(names.indexOf(name));return o}));let found=names.indexOf(old);el.value=String(found>=0?found:(id==='exclude-b'&&names.length>1?1:0))}let add=document.querySelector('[data-act="exclude-add"]');if(add)add.disabled=names.length<2}
function onInput(ev){if(ev.target.id==='names'){data.draft.namesText=ev.target.value;save();let len=parseSafeNames().length;let count=document.getElementById('count-label');if(count)count.textContent=len+' people';refreshExcludeOptions();return}if(['customDuration','themeCustom'].includes(ev.target.dataset.field)){data.draft[ev.target.dataset.field]=ev.target.value;save()}}
function loadHash(){let hash=location.hash;
 if(hash.startsWith('#join=')){let room=hash.slice(6).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,32);if(!room)return;remote=null;guest={room,name:'',waiting:false,error:'',over:false};try{guest.name=sessionStorage.getItem('nice_join_'+room)||''}catch{}initGuest(room);return}
 if(hash.startsWith('#mission=')){try{loadRemote(decode(hash.slice(9)));return}catch(err){toast('Invalid private mission link.')}}remote=null;guest=null;
}
document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('input',onInput);window.addEventListener('hashchange',()=>{loadHash();render()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&missionPeek){missionPeek=false;render()}else if(!document.hidden)updateClock()});document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='manual-name'){ev.preventDefault();addManualPlayer();return}if(ev.key==='Enter'&&ev.target.id==='guest-name'){ev.preventDefault();guestJoin();return}if(ev.key==='Escape'&&modal){modal=null;renderModal()}else if(ev.key==='Escape'&&missionPeek){missionPeek=false;render()}});
try{document.documentElement.dataset.theme=localStorage.getItem(THEME_KEY)==='light'?'light':'dark'}catch(err){document.documentElement.dataset.theme='dark'}
loadHash();render();if(!guest&&!remote)initHost();setInterval(updateClock,140);
})();
</script>
</body>
